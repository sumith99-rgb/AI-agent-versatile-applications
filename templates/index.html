<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LiftGuard AI Intercom</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="intercom-container">
        <div class="status-indicator">
            <div class="pulse-ring"></div>
            <div class="status-text" id="statusText">System Online</div>
        </div>
        
        <h1 class="brand-title">LiftGuard AI</h1>
        <p class="brand-subtitle">Emergency IP Intercom</p>
        
        <button id="talkButton" class="talk-button">
            <div class="button-icon">🎙️</div>
            <div class="button-text">Hold to Talk</div>
        </button>

        <div class="transcript-box">
            <p id="userTranscript" class="transcript user-text"></p>
            <p id="aiTranscript" class="transcript ai-text"></p>
        </div>
    </div>

    <script src="/static/app.js"></script>
</body>
</html>
